# Installed as /etc/systemd/system/buildkite-agent.service.d/railway-stop-timeout.conf.
# The packaged unit ships TimeoutStopSec=0, which systemd reads as infinity, so a
# disk-pressure stop under a long job would otherwise wait for it forever while
# the disk keeps filling. Idle scale-in is unaffected: the agent exits on its own
# there, and GCP's shutdown budget preempts this on external shutdown.
[Service]
TimeoutStopSec=10min
